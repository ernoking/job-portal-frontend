<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Matchwise — AI Job Matching</title>
    <meta name="title" content="Matchwise — AI Job Matching" />
    <meta
      name="description"
      content="Stop searching, start matching. Upload your CV, get honest AI fit scores with clear skill breakdowns, and apply to your best job matches with confidence."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://matchwise.tech/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://matchwise.tech/" />
    <meta property="og:site_name" content="Matchwise" />
    <meta property="og:title" content="Matchwise — AI-Powered Job Matching in 5 Minutes" />
    <meta
      property="og:description"
      content="Upload your CV, see why every job fits with transparent match scores, and track all your applications in one place."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Matchwise",
        "url": "https://matchwise.tech/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI-powered job matching platform that compares your CV with job roles and provides transparent fit scores and skill gap insights.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
